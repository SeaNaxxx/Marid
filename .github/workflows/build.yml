# Build the Marid debug APK on every push to main (and on demand).
# Pipeline: pnpm workspace install -> build @marid/server engine (+ workspace
# deps) -> pack the engine runtime bundle into the Android assets
# (runtime/marid-dist.tgz + sha256, consumed by runtime/Provisioner.kt) ->
# JDK 21 + Android SDK -> ./gradlew :app:assembleDebug -> upload artifact.
#
# Storage discipline (standing FALSE-CLAIMS-LOG context): one concurrency
# group cancels superseded runs, artifact retention is capped at 3 days —
# download the Marid-APK artifact promptly after the run finishes.
name: Build Marid APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager": "pnpm@10.33.2"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine (@marid/server + workspace deps)
        run: pnpm --filter "@marid/server..." build

      - name: Pack engine runtime bundle (marid-dist.tgz + sha256)
        run: |
          node scripts/marid-android/pack-runtime-dist.mjs \
            --dist packages/server/dist \
            --node-modules node_modules \
            --out android/app/src/main/assets/runtime/marid-dist.tgz

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest runners ship the Android SDK at $ANDROID_HOME; licenses
      # must be accepted before Gradle can resolve platforms/build-tools.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Ensure compileSdk 34 platform + build-tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact (Marid-APK)
        uses: actions/upload-artifact@v4
        with:
          name: Marid-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
