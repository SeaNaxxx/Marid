name: Build Qodex APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine (@qodex/server + workspace deps)
        run: pnpm --filter "@qodex/server..." build

      - name: Pack engine runtime bundle (qodex-dist.tgz + sha256)
        run: |
          node scripts/qodex-android/pack-runtime-dist.mjs \
            --dist packages/server/dist \
            --node-modules node_modules \
            --out android/app/src/main/assets/runtime/qodex-dist.tgz

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # sdkmanager exits non-zero even when licenses are already accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Ensure compileSdk 34 platform + build-tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact (Qodex-APK)
        uses: actions/upload-artifact@v4
        with:
          name: Qodex-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
